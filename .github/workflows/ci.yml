name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Instalar libs de sistema (egui/eframe)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libgl1-mesa-dev libwayland-dev
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        continue-on-error: true
        run: cargo fmt --all -- --check
      - name: clippy
        continue-on-error: true
        run: cargo clippy --all-targets

  build:
    name: build (${{ matrix.target }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Instalar libs de sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libgl1-mesa-dev libwayland-dev
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}
      - name: Empacotar AppImage (Linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x scripts/build-appimage.sh
          ./scripts/build-appimage.sh target/${{ matrix.target }}/release/ekaza-cam target/${{ matrix.target }}/release/ekaza-cam-linux-x86_64.AppImage
      - name: Upload artefato
        uses: actions/upload-artifact@v4
        with:
          name: ekaza-cam-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/ekaza-cam-linux-x86_64.AppImage
            target/${{ matrix.target }}/release/ekaza-cam
            target/${{ matrix.target }}/release/ekaza-cam.exe
          if-no-files-found: ignore
